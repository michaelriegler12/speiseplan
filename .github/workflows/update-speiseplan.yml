name: Speiseplan aktualisieren

on:
  repository_dispatch:
    types:
      - update-speiseplan

permissions:
  contents: write

jobs:
  update-speiseplan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: CSV aktualisieren
        env:
          CSV_BASE64: ${{ github.event.client_payload.csv }}
        run: |
          echo "$CSV_BASE64" | base64 --decode > speiseplan.csv

      - name: Änderung speichern
        run: |
          git config user.name "Power Automate"
          git config user.email "power-automate@users.noreply.github.com"
          git add speiseplan.csv
          git diff --cached --quiet || git commit -m "Speiseplan automatisch aktualisiert"
          git push
